<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .container { margin-top: 60px; }
        .card { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-custom { background: #007bff; color: #fff; }
        .btn-custom:hover { background: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <div class="row mb-4">
        <div class="col-md-6 offset-md-3">
            <div class="card p-4">
                <h2 class="mb-4 text-center">Edit Book</h2>
                <form method="POST">
                    <div class="mb-3">
                        <input type="text" class="form-control" name="title" value="{{ book.title }}" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" name="author" value="{{ book.author }}" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" class="form-control" name="year" value="{{ book.year }}" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100">Update Book</button>
                    <a href="/" class="btn btn-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
