<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .container { margin-top: 40px; }
        .card { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-custom { background: #007bff; color: #fff; }
        .btn-custom:hover { background: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h1 class="text-center">Library Management</h1>
        </div>
    </div>
    <div class="row mb-4">
        <div class="col-md-6 offset-md-3">
            <div class="card p-3">
                <form method="POST" action="/add">
                    <div class="mb-3">
                        <input type="text" class="form-control" name="title" placeholder="Book Title" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" name="author" placeholder="Author" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" class="form-control" name="year" placeholder="Year" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100">Add Book</button>
                </form>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                {% for book in books %}
                    <tr>
                        <td>{{ book.title }}</td>
                        <td>{{ book.author }}</td>
                        <td>{{ book.year }}</td>
                        <td>
                            <a href="/edit/{{ book.id }}" class="btn btn-sm btn-warning">Edit</a>
                            <a href="/delete/{{ book.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this book?');">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
